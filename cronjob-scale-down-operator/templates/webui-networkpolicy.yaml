{{- if and .Values.webui.enabled .Values.webui.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cronjob-scale-down-operator.fullname" . }}-webui
  labels:
    {{- include "cronjob-scale-down-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  podSelector:
    matchLabels:
      {{- include "cronjob-scale-down-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    # Metrics (authenticated) and health probes stay reachable.
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    {{- with .Values.webui.networkPolicy.from }}
    # The unauthenticated web UI is only reachable from the configured peers.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8082
          protocol: TCP
    {{- end }}
{{- end }}
