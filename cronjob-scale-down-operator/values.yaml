# Default values for cronjob-scale-down-operator.
replicaCount: 1

image:
  repository: ghcr.io/cronschedules/cronjob-scale-down-operator
  pullPolicy: IfNotPresent
  tag: "0.5.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Liveness probe configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Startup probe configuration
startupProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

nodeSelector: {}

tolerations: []

affinity: {}

# Enable metrics service
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8080

# RBAC configuration
rbac:
  create: true

# Leader election configuration
leaderElection:
  enabled: true

# Security policy for what a CronJobScaleDown may act on (operator image >= 0.5.0).
# The operator runs with a cluster-wide ClusterRole, so anyone able to create a
# CronJobScaleDown can direct its scale/delete rights. Keep these disabled on
# multi-tenant clusters.
security:
  # Allow spec.targetRef.namespace / spec.cleanupConfig.namespaces to reference
  # namespaces other than the CronJobScaleDown's own namespace.
  allowCrossNamespace: false
  # Allow cleanup of ClusterRole / ClusterRoleBinding.
  allowClusterScopedCleanup: false

# Web UI configuration
# The web UI has NO authentication and shows resources from every namespace.
# When disabled, the operator (>= 0.5.0) still serves it on 127.0.0.1:8082 inside the
# pod, reachable only with `kubectl port-forward`. Enabling it binds :8082 and creates
# a Service (and optionally an Ingress) - put it behind an authenticating proxy and/or
# enable webui.networkPolicy.
webui:
  enabled: false
  # Restrict which peers can reach the web UI port when it is exposed.
  networkPolicy:
    enabled: false
    # NetworkPolicyPeer list allowed to reach port 8082, e.g. your ingress controller:
    # from:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: ingress-nginx
    from: []
  service:
    type: ClusterIP
    port: 8082
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cronjob-ui.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
